---
airgap_apt_mirror_origin: https://repo.corp.example
airgap_apt_asset_dir: "{{ playbook_dir }}/assets"
airgap_apt_asset_sha256: {}
airgap_apt_docker_enabled: false
airgap_apt_timeout: 30
airgap_apt_refresh_deadline: 600
airgap_apt_release_map:
  '22.04': {codename: jammy, prefix: ubuntu22}
  '24.04': {codename: noble, prefix: ubuntu24}
airgap_apt_ubuntu_components: [main, restricted, universe, multiverse]
airgap_apt_ubuntu_pockets: ['', '-updates', '-security', '-backports']
# Include only channels actually mirrored; these are proposed path/suite defaults.
# FIPS and FIPS Updates are separately configurable and do not enable FIPS mode.
airgap_apt_fips_channels:
  - {name: fips, path: fips/ubuntu, suffix: '-updates'}
  - {name: fips-updates, path: fips-updates/ubuntu, suffix: '-updates'}
airgap_apt_corp_components: [main]
airgap_apt_corp_suite: "{{ airgap_apt_release.codename }}"
airgap_apt_repositories:

  - name: ubuntu
    path: ubuntu
    suites: "{{ airgap_apt_ubuntu_pockets | map('regex_replace', '^', airgap_apt_release.codename) | list }}"
    components: "{{ airgap_apt_ubuntu_components }}"
    key: ubuntu-archive-keyring.gpg

  - name: esm-infra
    path: infra/ubuntu
    suites: ["{{ airgap_apt_release.codename }}-infra-security", "{{ airgap_apt_release.codename }}-infra-updates"]
    components: [main]
    key: ubuntu-pro-esm-infra.gpg

  - name: esm-apps
    path: apps/ubuntu
    suites: ["{{ airgap_apt_release.codename }}-apps-security", "{{ airgap_apt_release.codename }}-apps-updates"]
    components: [main]
    key: ubuntu-pro-esm-apps.gpg

  - name: corp
    path: corp/ubuntu
    suites: ["{{ airgap_apt_corp_suite }}"]
    components: "{{ airgap_apt_corp_components }}"
    key: corp-archive-keyring.gpg
