name: Validate APT repositories
on: [push, pull_request, workflow_dispatch]
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
        ansible: ['2.18', '2.19']
    steps:
      - name: Install test prerequisites outside the role
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-venv python3-pip git openssl gnupg ca-certificates
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller test dependencies
        run: |
          python -m venv /opt/ansible-test
          /opt/ansible-test/bin/pip install 'ansible-core~=${{ matrix.ansible }}.0' -r tests/requirements.txt
      - name: Parse and render project
        run: /opt/ansible-test/bin/python -m unittest discover -s tests -v
      - name: Ansible syntax check
        run: /opt/ansible-test/bin/ansible-playbook site.yml --syntax-check
      - name: Exercise signed HTTPS fixture
        env:
          APT_REPOS_DISPOSABLE: '1'
        run: |
          export PATH="/opt/ansible-test/bin:$PATH"
          python tests/integration.py
